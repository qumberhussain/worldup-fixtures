<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup 2026 — Fixtures &amp; Results</title>
  <meta name="description" content="Live fixtures, upcoming matches and results for the FIFA World Cup 2026." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">⚽</span>
        <div>
          <h1>World Cup 2026</h1>
          <p class="tagline">Fixtures &amp; Results</p>
        </div>
      </div>
      <div class="meta" id="meta">
        <span class="status-dot" id="sourceDot" title="Data source"></span>
        <span id="updated">Loading…</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="controls">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Match views">
        <button class="tab is-active" data-view="upcoming" role="tab" aria-selected="true">Upcoming</button>
        <button class="tab" data-view="results" role="tab" aria-selected="false">Results</button>
        <button class="tab" data-view="all" role="tab" aria-selected="false">All</button>
      </nav>
      <div class="search">
        <input type="search" id="search" placeholder="Filter by team, group or venue…" aria-label="Filter matches" autocomplete="off" />
      </div>
    </div>

    <div id="liveStrip" class="live-strip" hidden></div>

    <section id="content" class="content" aria-live="polite">
      <div class="skeleton-list" id="skeleton">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Data via <a href="https://www.football-data.org/" rel="noopener" target="_blank">football-data.org</a>. Times shown in your local timezone.</p>
    </div>
  </footer>

  <script src="./assets/app.js" defer></script>
</body>
</html>
