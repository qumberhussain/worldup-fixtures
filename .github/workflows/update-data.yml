name: Update fixtures data

on:
  schedule:
    # Every 20 minutes. NOTE: scheduled runs only fire from the default branch.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest fixtures
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/fetch-fixtures.mjs

      - name: Commit changes if any
        run: |
          if git diff --quiet -- data/fixtures.json; then
            echo "No changes to fixtures."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git commit -m "chore: refresh fixtures data"
          git push
